<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DocTooth</title>
</head>

<body>

<main class="hero">

  <!-- Contenedor principal -->
  <div class="hero-container">

    <!-- Logo -->
    <header class="header">
      <app-navbar-component/>
    </header>


    <!-- Contenido principal -->
    <section class="hero-content">

      <!-- Texto -->
      <div class="hero-text">

        <h1>
          La solución inteligente
          para la gestión de tu
          clínica dental.
        </h1>

        <p>
          Gestiona pacientes, citas y procesos
          administrativos de manera sencilla,
          rápida y eficiente.
        </p>

        <!-- BOTONES -->
        <div class="hero-buttons">

          <a href="/authentication/login" class="btn btn-primary">
            Iniciar sesión
          </a>

          <a href="/authentication/register" class="btn btn-secondary">
            Registrarse
          </a>

        </div>

      </div>


      <!-- IMAGEN -->
      <div class="hero-image">

        <img src="/doctor.svg" alt="Imagen de referencia">

      </div>

    </section>

  </div>


  <!-- Parte inferior blanca con curva -->
  <div class="bottom-section">

  </div>

</main>
</body>
</html>
