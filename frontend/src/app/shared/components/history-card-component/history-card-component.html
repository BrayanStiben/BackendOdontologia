<article class="history-card">

  <!-- =====================================================
       ENCABEZADO
       ===================================================== -->

  <div class="history-header">

    <div class="history-date">

            <span class="date-icon">

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                >

                    <rect
                      x="3"
                      y="5"
                      width="18"
                      height="16"
                      rx="2"
                      stroke="currentColor"
                      stroke-width="1.7"
                    />

                    <path
                      d="M16 3V7"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                    />

                    <path
                      d="M8 3V7"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                    />

                    <path
                      d="M3 10H21"
                      stroke="currentColor"
                      stroke-width="1.7"
                    />

                </svg>

            </span>


      <div>

                <span class="date-label">
                    Fecha de atención
                </span>

        <span class="date-value">
                    {{ fecha }}
                </span>

      </div>

    </div>


    <span class="history-status">
            Atención registrada
        </span>

  </div>



  <!-- =====================================================
       CONTENIDO
       ===================================================== -->

  <div class="history-content">


    <!-- DIAGNÓSTICO -->

    <div class="history-section">

      <div class="section-icon">

        <svg
          viewBox="0 0 24 24"
          fill="none"
        >

          <circle
            cx="12"
            cy="12"
            r="9"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M12 10V16"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <circle
            cx="12"
            cy="7"
            r="1"
            fill="currentColor"
          />

        </svg>

      </div>


      <div class="section-content">

                <span class="section-label">
                    Diagnóstico
                </span>

        <p class="section-value">
          {{ diagnostico }}
        </p>

      </div>

    </div>



    <!-- TRATAMIENTO -->

    <div class="history-section">

      <div class="section-icon">

        <svg
          viewBox="0 0 24 24"
          fill="none"
        >

          <path
            d="M8 4H16"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <path
            d="M6 7H18"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <rect
            x="5"
            y="7"
            width="14"
            height="14"
            rx="2"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M9 12H15"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <path
            d="M12 9V15"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

        </svg>

      </div>


      <div class="section-content">

                <span class="section-label">
                    Tratamiento
                </span>

        <p class="section-value">
          {{ tratamiento }}
        </p>

      </div>

    </div>



    <!-- OBSERVACIONES -->

    <div class="history-section observations">

      <div class="section-icon">

        <svg
          viewBox="0 0 24 24"
          fill="none"
        >

          <path
            d="M5 4H19C20.1 4 21 4.9 21 6V15C21 16.1 20.1 17 19 17H11L6 21V17H5C3.9 17 3 16.1 3 15V6C3 4.9 3.9 4 5 4Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />

          <path
            d="M7 8H17"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <path
            d="M7 12H14"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

        </svg>

      </div>


      <div class="section-content">

                <span class="section-label">
                    Observaciones
                </span>

        <p class="section-value">
          {{ observaciones }}
        </p>

      </div>

    </div>

  </div>



  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <div class="history-footer">

        <span class="footer-info">
            Registro de atención odontológica
        </span>


    <button
      type="button"
      class="detail-button"
      (click)="verDetalle.emit()"
    >

      Ver detalle

      <svg
        viewBox="0 0 24 24"
        fill="none"
      >

        <path
          d="M5 12H19"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M13 6L19 12L13 18"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

      </svg>

    </button>

  </div>

</article>
